<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <style>
        /* ---- Palette: deep slate surface, warm amber accent, off-white text ---- */
        :root {
            --surface:      #12161f;
            --card:         #1b212e;
            --card-edge:    #2a3244;
            --text:         #eef1f6;
            --text-muted:   #949db3;
            --accent:       #f0a830;
            --accent-soft:  rgba(240, 168, 48, 0.18);
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;      /* vertical centering  */
            justify-content: center;  /* horizontal centering */
            padding: 24px;
            background:
                radial-gradient(900px 500px at 50% -10%, #1f2738 0%, transparent 70%),
                var(--surface);
            font-family: "Inter", "Segoe UI", system-ui, -apple-system, sans-serif;
            color: var(--text);
        }

        /* ---- The centered box ---- */
        .login-card {
            position: relative;
            width: 100%;
            max-width: 400px;
            padding: 44px 38px 30px;
            background: var(--card);
            border: 1px solid var(--card-edge);
            border-radius: 14px;
            box-shadow: 0 24px 60px rgba(0, 0, 0, 0.45);
            overflow: hidden;
        }

        /* Signature move: amber bar capping the card */
        .login-card::before {
            content: "";
            position: absolute;
            top: 0; left: 0; right: 0;
            height: 4px;
            background: linear-gradient(90deg, var(--accent), #f5cf7a);
        }

        h2 {
            margin: 0 0 6px;
            font-size: 28px;
            font-weight: 700;
            letter-spacing: -0.5px;
        }

        .subtitle {
            margin: 0 0 28px;
            font-size: 14px;
            color: var(--text-muted);
        }

        /* ---- Styling Django's {{ form.as_p }} output ---- */
        form p {
            margin: 0 0 18px;
            display: flex;
            flex-direction: column;
        }

        form label {
            margin-bottom: 7px;
            font-size: 11px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--text-muted);
        }

        form input {
            width: 100%;
            padding: 12px 14px;
            font-size: 15px;
            font-family: inherit;
            color: var(--text);
            background: #141924;
            border: 1px solid var(--card-edge);
            border-radius: 8px;
            transition: border-color 0.18s ease, box-shadow 0.18s ease;
        }

            /*form input::placeholder { color: #5d6staff; }*/

        form input:focus {
            outline: none;
            border-color: var(--accent);
            box-shadow: 0 0 0 3px var(--accent-soft); /* visible focus ring for a11y */
        }

        /* Django renders validation errors as .errorlist */
        form ul.errorlist {
            margin: 0 0 14px;
            padding-left: 18px;
            font-size: 13px;
            color: #ff8a7a;
        }

        button[type="submit"] {
            width: 100%;
            margin-top: 6px;
            padding: 13px;
            font-family: inherit;
            font-size: 15px;
            font-weight: 600;
            color: #1a1206;
            background: var(--accent);
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: transform 0.12s ease, background 0.18s ease;
        }

        button[type="submit"]:hover { background: #ffbc4a; }
        button[type="submit"]:active { transform: translateY(1px); }
        button[type="submit"]:focus-visible {
            outline: 2px solid #fff;
            outline-offset: 2px;
        }

        /* ---- Forgot password, pinned to the bottom of the box ---- */
        .forgot {
            margin-top: 24px;
            padding-top: 18px;
            border-top: 1px solid var(--card-edge);
            text-align: center;
        }

        .forgot a {
            font-size: 13.5px;
            color: var(--text-muted);
            text-decoration: none;
            border-bottom: 1px solid transparent;
            transition: color 0.18s ease, border-color 0.18s ease;
        }

        .forgot a:hover,
        .forgot a:focus-visible {
            color: var(--accent);
            border-bottom-color: var(--accent);
        }

        @media (max-width: 420px) {
            .login-card { padding: 36px 24px 24px; }
            h2 { font-size: 24px; }
        }
    </style>
</head>
<body>
    <main class="login-card">
        <h2>Login</h2>
        <p class="subtitle">Sign in to continue to your account.</p>

        <form method="post">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit">Login</button>
        </form>

        <div class="forgot">
            <a href="#">Forgot your password?</a>
        </div>
    </main>
</body>
</html>
